name: forward-sweep

# Measures the per-connection cost of `openshell forward service` end to end
# on a hosted runner, once with the opendatahub images (baseline) and once
# with the rh-forge images (patched: SQLite store in WAL + synchronous=NORMAL),
# and prints a before/after table. Evidence for NVIDIA/OpenShell#3494.
#
# Both sets run back to back on the same runner (same disk, fresh state
# directory each) so the disk commit cost is identical for the comparison.
# The patched gateway comes either from a build of this checkout with
# deploy/docker/Dockerfile.gha.gateway (`patched_source: build`, the default;
# needs no credentials, so anyone can run it) or from the published rh-forge
# image (`patched_source: image`, org-internal package). In build mode the
# patched set uses the public baseline CLI and supervisor images: same source
# commit, only the gateway differs, which is exactly the change under test.
# For each set the gateway and CLI binaries are extracted from the images, a
# single-node gateway runs on the runner with the Docker compute driver
# (mTLS, file-backed SQLite on the runner disk, supervisor taken from that
# set's supervisor image), a sandbox serves loopback HTTP, and
# scripts/forward-sweep/sweep.py opens bursts of TCP connections through the
# forward. See scripts/forward-sweep/run-set.sh.

on:
  workflow_dispatch:
    inputs:
      baseline_tag:
        description: "quay.io/opendatahub/odh-openshell-* tag (baseline)"
        required: false
        type: string
        default: "v0.0.116-rhaiv.0"
      patched_source:
        description: "Patched gateway: build it from this checkout (public), or pull the ghcr.io/rh-forge image (org-internal)"
        required: false
        type: choice
        options: [build, image]
        default: build
      patched_tag:
        description: "ghcr.io/rh-forge/odh-openshell-* tag (patched, only with patched_source=image)"
        required: false
        type: string
        default: "v0.0.116-rhaiv.0-forge.1"

permissions:
  contents: read
  packages: read

jobs:
  sweep:
    name: Sweep baseline then patched
    runs-on: ubuntu-latest
    # The gateway build (bundled Z3 + full Rust build) takes roughly 30-60 min
    # cold on 4 vCPU; the two sweeps themselves take about 5 min.
    timeout-minutes: 150
    env:
      BASELINE_TAG: ${{ inputs.baseline_tag }}
      PATCHED_TAG: ${{ inputs.patched_tag }}
      PATCHED_SOURCE: ${{ inputs.patched_source }}
      BUILT_GATEWAY_IMAGE: localhost/odh-openshell-gateway:patched
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free runner disk space
        if: inputs.patched_source == 'build'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Log in to ghcr.io
        if: inputs.patched_source == 'image'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: inputs.patched_source == 'build'

      - name: Build the patched gateway image from this checkout
        if: inputs.patched_source == 'build'
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build --load \
            -t "${BUILT_GATEWAY_IMAGE}" \
            --build-arg "OPENSHELL_VERSION=${BASELINE_TAG}-patched" \
            -f deploy/docker/Dockerfile.gha.gateway .
          docker run --rm --entrypoint /usr/local/bin/openshell-gateway "${BUILT_GATEWAY_IMAGE}" --version
          docker image ls "${BUILT_GATEWAY_IMAGE}"
          df -h /

      - name: Runner facts
        run: |
          docker info --format 'docker {{.ServerVersion}} on {{.OperatingSystem}} ({{.Architecture}}, {{.NCPU}} cpu, {{.MemTotal}} bytes)'
          df -hT "$RUNNER_TEMP" | tail -n 1
          uname -r

      - name: Baseline (opendatahub images)
        shell: bash
        env:
          SET_NAME: baseline
          IMAGE_PREFIX: quay.io/opendatahub
          IMAGE_TAG: ${{ env.BASELINE_TAG }}
        run: |
          set -euo pipefail
          OUT_ROOT="${RUNNER_TEMP}/forward-sweep-out"
          export GATEWAY_IMAGE="${IMAGE_PREFIX}/odh-openshell-gateway:${IMAGE_TAG}"
          export SUPERVISOR_IMAGE="${IMAGE_PREFIX}/odh-openshell-supervisor:${IMAGE_TAG}"
          export CLI_IMAGE="${IMAGE_PREFIX}/odh-openshell-cli:${IMAGE_TAG}"
          export OUT_DIR="${OUT_ROOT}/${SET_NAME}"
          scripts/forward-sweep/run-set.sh

      - name: Patched (gateway built here or rh-forge images)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          SET_NAME: patched
        run: |
          set -euo pipefail
          OUT_ROOT="${RUNNER_TEMP}/forward-sweep-out"
          if [ "${PATCHED_SOURCE}" = "build" ]; then
            export GATEWAY_IMAGE="${BUILT_GATEWAY_IMAGE}"
            export SUPERVISOR_IMAGE="quay.io/opendatahub/odh-openshell-supervisor:${BASELINE_TAG}"
            export CLI_IMAGE="quay.io/opendatahub/odh-openshell-cli:${BASELINE_TAG}"
          else
            export GATEWAY_IMAGE="ghcr.io/rh-forge/odh-openshell-gateway:${PATCHED_TAG}"
            export SUPERVISOR_IMAGE="ghcr.io/rh-forge/odh-openshell-supervisor:${PATCHED_TAG}"
            export CLI_IMAGE="ghcr.io/rh-forge/odh-openshell-cli:${PATCHED_TAG}"
          fi
          export OUT_DIR="${OUT_ROOT}/${SET_NAME}"
          scripts/forward-sweep/run-set.sh

      - name: Before/after report
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          OUT_ROOT="${RUNNER_TEMP}/forward-sweep-out"
          if [ ! -f "${OUT_ROOT}/baseline/results.json" ] || [ ! -f "${OUT_ROOT}/patched/results.json" ]; then
            echo "::error::one or both sets produced no results.json; see the step logs"
            exit 1
          fi
          python3 scripts/forward-sweep/report.py \
            --baseline "${OUT_ROOT}/baseline/results.json" \
            --patched "${OUT_ROOT}/patched/results.json" \
            | tee "${OUT_ROOT}/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw outputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: forward-sweep
          path: ${{ runner.temp }}/forward-sweep-out
          if-no-files-found: warn
